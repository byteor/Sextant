name: Installers

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  macos-installer:
    name: macOS installer
    runs-on: macos-latest
    environment: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Check release tag matches lib/version.dart
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          EXPECTED="v$MAJOR.$MINOR"
          case "$TAG" in
            "$EXPECTED"|"$EXPECTED".*) ;;
            *)
              echo "::error::Release tag '$TAG' does not match lib/version.dart ($EXPECTED.x). Bump kAppVersionMajor/Minor and merge before releasing." >&2
              exit 1
              ;;
          esac

      # Imports the Apple Development certificate and the WWDR G3 intermediate
      # CA into a temporary keychain so codesign can sign the build.
      # Requires three repository secrets (see .github/actions/macos-import-cert).
      - name: Import signing certificate
        id: import-cert
        uses: ./.github/actions/macos-import-cert
        with:
          certificate:     ${{ secrets.MACOS_CERTIFICATE }}
          certificate-pwd: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-pwd:    ${{ secrets.MACOS_KEYCHAIN_PWD }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: |
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          BUILD_NAME="$MAJOR.$MINOR"
          BUILD_NUM=$(git rev-list --count HEAD)
          flutter build macos --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define="BUILD_NUMBER=$BUILD_NUM"

      - name: Package DMG
        run: |
          brew install create-dmg
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          create-dmg \
            --volname "Sextant" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "sextant.app" 140 190 \
            --app-drop-link 400 190 \
            "Sextant-$MAJOR.$MINOR.dmg" \
            "build/macos/Build/Products/Release/sextant.app"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "${{ steps.import-cert.outputs.keychain-path }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Sextant-*.dmg

  # ── Linux (.deb) ─────────────────────────────────────────────────────────────
  linux-installer:
    name: Linux installer (.deb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Check release tag matches lib/version.dart
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          EXPECTED="v$MAJOR.$MINOR"
          case "$TAG" in
            "$EXPECTED"|"$EXPECTED".*) ;;
            *)
              echo "::error::Release tag '$TAG' does not match lib/version.dart ($EXPECTED.x). Bump kAppVersionMajor/Minor and merge before releasing." >&2
              exit 1
              ;;
          esac

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: |
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          BUILD_NAME="$MAJOR.$MINOR"
          BUILD_NUM=$(git rev-list --count HEAD)
          flutter build linux --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define="BUILD_NUMBER=$BUILD_NUM"

      - name: Package .deb
        run: |
          MAJOR=$(grep 'kAppVersionMajor' lib/version.dart | grep -oE '[0-9]+')
          MINOR=$(grep 'kAppVersionMinor' lib/version.dart | grep -oE '[0-9]+')
          BUILD_NUM=$(git rev-list --count HEAD)
          VERSION="$MAJOR.$MINOR.$BUILD_NUM"

          mkdir -p sextant_pkg/opt/sextant sextant_pkg/DEBIAN
          cp -r build/linux/x64/release/bundle/. sextant_pkg/opt/sextant/

          cat > sextant_pkg/DEBIAN/control <<EOF
          Package: sextant
          Version: $VERSION
          Architecture: amd64
          Maintainer: IonJet
          Description: Lightweight LAN scanner
           Discovers and monitors devices on your local network.
          EOF

          dpkg-deb --build sextant_pkg "sextant_${VERSION}_amd64.deb"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: sextant_*_amd64.deb

  # ── Windows (Inno Setup) ──────────────────────────────────────────────────────
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Check release tag matches lib/version.dart
        shell: pwsh
        run: |
          $Tag = "${{ github.event.release.tag_name }}"
          $Major = (Select-String 'kAppVersionMajor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $Minor = (Select-String 'kAppVersionMinor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $Expected = "v$Major.$Minor"
          if ($Tag -ne $Expected -and -not ($Tag -like "$Expected.*")) {
            Write-Host "::error::Release tag '$Tag' does not match lib/version.dart ($Expected.x). Bump kAppVersionMajor/Minor and merge before releasing."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        shell: pwsh
        run: |
          $Major    = (Select-String 'kAppVersionMajor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $Minor    = (Select-String 'kAppVersionMinor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $BuildName = "$Major.$Minor"
          $BuildNum  = git rev-list --count HEAD
          flutter build windows --release `
            --build-name="$BuildName" `
            --build-number="$BuildNum" `
            --dart-define="BUILD_NUMBER=$BuildNum"

      - name: Package installer
        shell: pwsh
        run: |
          $Major   = (Select-String 'kAppVersionMajor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $Minor   = (Select-String 'kAppVersionMinor = (\d+)' lib/version.dart).Matches[0].Groups[1].Value
          $Version = "$Major.$Minor"

          magick icon_256.png -define icon:auto-resize=256,128,64,48,32,16 windows\installer.ico

          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\installer.iss" "/DMyAppVersion=$Version"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/Sextant-Setup-*.exe
